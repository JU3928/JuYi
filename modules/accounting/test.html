<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记账模块测试 — JuYi</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 1.3rem; }
  .result { padding: 6px 12px; margin: 4px 0; border-radius: 4px; font-size: 13px; font-family: monospace; }
  .pass { background: #064e3b; color: #6ee7b7; }
  .fail { background: #7f1d1d; color: #fca5a5; }
  .section { margin: 1rem 0; padding: 0.5rem; border-left: 3px solid #818cf8; }
  .summary { padding: 1rem; border-radius: 8px; font-weight: bold; font-size: 1.1rem; margin-top: 1rem; }
  .summary.all-pass { background: #064e3b; }
  .summary.has-fail { background: #7f1d1d; }
  button { padding: 0.5rem 1.5rem; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; color: #fff; background: #4f46e5; }
  button:hover { background: #4338ca; }
</style>
</head>
<body>
<h1>💰 记账模块 · 功能测试</h1>
<div id="results"><p>点击按钮开始测试...</p></div>
<button onclick="runTests()">▶ 开始测试</button>

<script>
const STORE = 'accounting_test';
const DB_NAME = 'JuYiAccountingTest';

class DB {
  constructor() { this.db = null; }
  open(name, version, stores) {
    return new Promise((resolve, reject) => {
      const r = indexedDB.open(name, version);
      r.onupgradeneeded = e => {
        for (const [sn, def] of Object.entries(stores)) {
          const s = e.target.result.objectStoreNames.contains(sn) ? e.target.transaction.objectStore(sn) : e.target.result.createObjectStore(sn, { keyPath: def.keyPath, autoIncrement: def.autoIncrement !== false });
          for (const idx of def.indexes || []) { if (!s.indexNames.contains(idx.name)) s.createIndex(idx.name, idx.keyPath, { unique: idx.unique || false }); }
        }
      };
      r.onsuccess = e => { this.db = e.target.result; resolve(this.db); };
      r.onerror = e => reject(e.target.error);
    });
  }
  _tx(sn, mode, cb) { return new Promise((resolve, reject) => { const tx = this.db.transaction(sn, mode); const store = tx.objectStore(sn); const res = cb(store); if (res && typeof res.then === 'function') { res.then(resolve).catch(reject); } else { tx.oncomplete = () => resolve(res); tx.onerror = () => reject(tx.error); } }); }
  _p(r) { return new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); }); }
  add(sn, item) { return this._tx(sn, 'readwrite', s => this._p(s.add(item))); }
  put(sn, item) { return this._tx(sn, 'readwrite', s => this._p(s.put(item))); }
  get(sn, id) { return this._tx(sn, 'readonly', s => this._p(s.get(id))); }
  getAll(sn) { return this._tx(sn, 'readonly', s => this._p(s.getAll())); }
  delete(sn, id) { return this._tx(sn, 'readwrite', s => this._p(s.delete(id))); }
  clear(sn) { return this._tx(sn, 'readwrite', s => this._p(s.clear())); }
}

let pass = 0, fail = 0;
const out = document.getElementById('results');

function result(label, ok, detail) {
  const div = document.createElement('div');
  div.className = 'result ' + (ok ? 'pass' : 'fail');
  div.textContent = (ok ? '✅ ' : '❌ ') + label + (detail ? '  (' + detail + ')' : '');
  out.appendChild(div);
  ok ? pass++ : fail++;
}

function section(title) {
  const div = document.createElement('div');
  div.className = 'section';
  div.innerHTML = '<strong>' + title + '</strong>';
  out.appendChild(div);
}

async function runTests() {
  pass = 0; fail = 0; out.innerHTML = '';
  const db = new DB();

  try {
    indexedDB.deleteDatabase(DB_NAME);
    await new Promise(r => setTimeout(r, 300));
    await db.open(DB_NAME, 1, {
      [STORE]: { keyPath: 'id', autoIncrement: true, indexes: [{ name: 'date', keyPath: 'date' }, { name: 'type', keyPath: 'type' }] }
    });

    // ====== 1. CRUD ======
    section('1. CRUD 操作');

    const i1 = await db.add(STORE, { type: 'income', amount: 8000, category: '工资', date: new Date('2026-06-01').getTime(), notes: '6月工资', tags: ['固定'], createdAt: Date.now() });
    result('添加工资收入', i1 > 0, '¥8000, id=' + i1);

    const e1 = await db.add(STORE, { type: 'expense', amount: 35.5, category: '餐饮', date: new Date('2026-06-02').getTime(), notes: '午餐', tags: ['日常'], createdAt: Date.now() });
    result('添加餐饮支出', e1 > 0, '¥35.5, id=' + e1);

    // More records across categories
    await db.add(STORE, { type: 'expense', amount: 200, category: '交通', date: new Date('2026-06-03').getTime(), tags: ['通勤'], createdAt: Date.now() });
    await db.add(STORE, { type: 'expense', amount: 1500, category: '住房', date: new Date('2026-06-05').getTime(), tags: ['固定'], createdAt: Date.now() });
    await db.add(STORE, { type: 'expense', amount: 88, category: '娱乐', date: new Date('2026-06-08').getTime(), tags: ['冲动消费'], createdAt: Date.now() });
    await db.add(STORE, { type: 'income', amount: 2000, category: '兼职', date: new Date('2026-06-10').getTime(), tags: ['额外'], createdAt: Date.now() });
    await db.add(STORE, { type: 'expense', amount: 45, category: '餐饮', date: new Date('2026-06-12').getTime(), tags: ['日常'], createdAt: Date.now() });
    await db.add(STORE, { type: 'expense', amount: 300, category: '购物', date: new Date('2026-06-15').getTime(), tags: ['冲动消费'], createdAt: Date.now() });
    result('添加 6 条额外记录', true, '共 8 条');

    const all = await db.getAll(STORE);
    result('getAll 返回 8 条', all.length === 8, all.length + ' 条');

    // Get by ID
    const item = await db.get(STORE, i1);
    result('按 ID 查询收入', item && item.amount === 8000, '¥' + item.amount);

    // Update
    item.notes = '6月工资(已加绩效)';
    item.amount = 8500;
    await db.put(STORE, item);
    const updated = await db.get(STORE, i1);
    result('更新金额 8000→8500', updated.amount === 8500 && updated.notes.includes('绩效'), '¥' + updated.amount);

    // Delete
    await db.delete(STORE, e1);
    const afterDel = await db.getAll(STORE);
    result('删除 1 条后剩 7 条', afterDel.length === 7, afterDel.length + ' 条');
    const deleted = await db.get(STORE, e1);
    result('已删除的记录返回 undefined', deleted === undefined);

    // ====== 2. Type filtering ======
    section('2. 收支分类');

    const incomes = all.filter(r => r.type === 'income');
    const expenses = all.filter(r => r.type === 'expense');
    result('收入记录 2 条', incomes.length === 2);
    result('支出记录 6 条 (含已删)', expenses.length === 6);

    const totalIncome = incomes.reduce((s, r) => s + r.amount, 0);
    const totalExpense = expenses.reduce((s, r) => s + r.amount, 0);
    result('总收入 ¥10000', totalIncome === 10000, '¥' + totalIncome);
    result('总支出 ¥2168.5', totalExpense === 2168.5, '¥' + totalExpense);

    // ====== 3. Category aggregation ======
    section('3. 分类聚合 (供饼图)');

    const catMap = new Map();
    for (const r of expenses) catMap.set(r.category, (catMap.get(r.category) || 0) + r.amount);
    result('支出分类数 ≥ 4', catMap.size >= 4, catMap.size + ' 类');
    result('餐饮类总额', catMap.get('餐饮') === 80.5, '¥' + catMap.get('餐饮'));
    result('住房类总额', catMap.get('住房') === 1500, '¥' + catMap.get('住房'));
    result('类别总额等于总支出', [...catMap.values()].reduce((s, v) => s + v, 0) === totalExpense);

    const sorted = [...catMap].sort((a, b) => b[1] - a[1]);
    result('分类排序正确 (住房第一)', sorted[0][0] === '住房', sorted[0][0] + ' ¥' + sorted[0][1]);
    result('每类金额 > 0', sorted.every(([, v]) => v > 0));

    // ====== 4. Monthly filtering ======
    section('4. 月度筛选');

    const juneItems = all.filter(r => {
      const d = new Date(r.date); return d.getFullYear() === 2026 && d.getMonth() === 5; // June
    });
    result('6 月记录 8 条', juneItems.length === 8, juneItems.length + ' 条');

    // Add July record
    await db.add(STORE, { type: 'expense', amount: 100, category: '餐饮', date: new Date('2026-07-01').getTime(), tags: ['日常'], createdAt: Date.now() });
    const julyItems = (await db.getAll(STORE)).filter(r => {
      const d = new Date(r.date); return d.getFullYear() === 2026 && d.getMonth() === 6;
    });
    result('7 月记录 1 条', julyItems.length === 1);

    const crossMonth = await db.getAll(STORE);
    result('跨月总记录 8 条', crossMonth.length === 8);

    // ====== 5. Tags ======
    section('5. 标签系统');

    const allItems = await db.getAll(STORE);
    const allTags = new Map();
    allItems.forEach(r => (r.tags || []).forEach(t => allTags.set(t, (allTags.get(t) || 0) + 1)));
    result('标签数 ≥ 3', allTags.size >= 3, allTags.size + ' 个');

    const fixTag = allItems.filter(r => (r.tags || []).includes('固定'));
    result('标签"固定"出现 2 次', fixTag.length === 2);

    const dailyTag = allItems.filter(r => (r.tags || []).includes('日常'));
    result('标签"日常"出现 2 次', dailyTag.length === 2);

    const impulseTag = allItems.filter(r => (r.tags || []).includes('冲动消费'));
    result('标签"冲动消费"出现 2 次', impulseTag.length === 2);

    // ====== 6. Data integrity ======
    section('6. 数据完整性');

    result('所有记录有 type', allItems.every(r => r.type === 'income' || r.type === 'expense'));
    result('所有记录有 amount > 0', allItems.every(r => typeof r.amount === 'number' && r.amount > 0));
    result('所有记录有 category', allItems.every(r => r.category && r.category.trim()));
    result('所有记录有 date', allItems.every(r => typeof r.date === 'number' && r.date > 0));
    result('所有记录 category 在预设内', allItems.every(r => {
      const cats = ['工资','奖金','兼职','理财','红包','报销','其他收入','餐饮','交通','购物','住房','娱乐','医疗','教育','通讯','人情','其他支出'];
      return cats.includes(r.category);
    }), '18 种分类全部匹配');

    // ====== 7. Export/Import ======
    section('7. 导出 / 导入');

    const exportData = { _format: 'JuYiAccounting/1', exportedAt: new Date().toISOString(), items: await db.getAll(STORE) };
    const json = JSON.stringify(exportData);
    result('导出 JSON 非空', json.length > 100, json.length + ' bytes');

    const parsed = JSON.parse(json);
    result('导出格式正确', parsed._format === 'JuYiAccounting/1' && Array.isArray(parsed.items));
    result('导出全部 8 条', parsed.items.length === 8);

    // Round-trip
    await db.clear(STORE);
    let empty = await db.getAll(STORE);
    result('清空后 0 条', empty.length === 0);

    for (const item of parsed.items) await db.add(STORE, item);
    const restored = await db.getAll(STORE);
    result('导入恢复 8 条', restored.length === 8);
    result('恢复后收入金额一致', restored.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0) === 10500);

    // ====== 8. Edge cases ======
    section('8. 边界情况');

    const minAmount = await db.add(STORE, { type: 'expense', amount: 0.01, category: '餐饮', date: Date.now(), tags: [], createdAt: Date.now() });
    result('最小金额 ¥0.01', minAmount > 0);

    const largeAmount = await db.add(STORE, { type: 'income', amount: 999999.99, category: '其他收入', date: Date.now(), tags: [], createdAt: Date.now() });
    result('大额收入 ¥999999.99', largeAmount > 0);

    const longNote = await db.add(STORE, { type: 'expense', amount: 1, category: '餐饮', date: Date.now(), notes: 'A'.repeat(500), tags: [], createdAt: Date.now() });
    result('长备注 500 字符', longNote > 0);

    const emptyTags = await db.add(STORE, { type: 'expense', amount: 1, category: '餐饮', date: Date.now(), tags: [], createdAt: Date.now() });
    const etItem = await db.get(STORE, emptyTags);
    result('空标签数组', Array.isArray(etItem.tags) && etItem.tags.length === 0);

    // ====== 9. Calculation consistency ======
    section('9. 计算一致性');

    const final = await db.getAll(STORE);
    const incSum = final.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
    const expSum = final.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
    const balance = incSum - expSum;
    result('收入 > 支出', incSum > expSum, '结余 ¥' + balance.toFixed(2));
    result('收入分类合计 = 总收入', incSum === 10500 + 999999.99, '¥' + incSum.toFixed(2));
    result('金额精确到分', final.every(r => (r.amount * 100) % 1 === 0));

  } catch (e) {
    result('测试异常', false, e.message);
    console.error(e);
  } finally {
    indexedDB.deleteDatabase(DB_NAME);
  }

  const total = pass + fail;
  const summary = document.createElement('div');
  summary.className = 'summary ' + (fail === 0 ? 'all-pass' : 'has-fail');
  summary.textContent = fail === 0
    ? '🎉 全部通过! ' + pass + '/' + total
    : '⚠️ 通过 ' + pass + '/' + total + ' (' + fail + ' 失败)';
  out.appendChild(summary);
}
</script>
</body>
</html>
