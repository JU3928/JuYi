<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>诊断 — JuYi</title></head>
<body>
<h2>错题本诊断</h2>
<div id="log"></div>
<script src="../../shared/db-core.js"></script>
<script src="../../shared/utils.js"></script>
<script>
var log = document.getElementById('log');
function ok(msg) { log.innerHTML += '<div style="color:green">✅ ' + msg + '</div>'; }
function err(msg) { log.innerHTML += '<div style="color:red">❌ ' + msg + '</div>'; }

try {
  var db = new JuYiDB();
  ok('new JuYiDB() 成功');
} catch(e) { err('new JuYiDB: ' + e.message); }

try {
  var s = sanitizeHtml('<p>test</p><script>alert(1)<\/script>');
  ok('sanitizeHtml 可用，结果: ' + s.substring(0, 50));
} catch(e) { err('sanitizeHtml: ' + e.message); }

try {
  var e = esc('<script>');
  ok('esc 可用');
} catch(ex) { err('esc: ' + ex.message); }

// test DB open
(async function(){
  try {
    await db.open('JuYiDB', 2, {
      errorNotebook: { keyPath: 'id', autoIncrement: true, indexes: [
        { name: 'subject', keyPath: 'subject' },
        { name: 'createdAt', keyPath: 'createdAt' },
        { name: 'isHard', keyPath: 'isHard' }
      ]},
      reviewProgress: { keyPath: 'subject', autoIncrement: false, indexes: [] }
    });
    ok('db.open("JuYiDB", 2, ...) 成功');
  } catch(e) { err('db.open: ' + e.message); }

  try {
    var items = await db.getAll('errorNotebook');
    ok('db.getAll("errorNotebook") 返回 ' + items.length + ' 条记录');
    if (items.length > 0) {
      ok('示例数据: subject=' + items[0].subject + ', has question=' + !!items[0].question);
    } else {
      err('没有数据！错题本为空');
    }
  } catch(e) { err('db.getAll: ' + e.message); }
})();
</script>
</body>
</html>
