<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>做题本 — JuYi</title>
  <link rel="stylesheet" href="../../shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app" class="app-layout">

  <!-- 侧边栏 -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar__header">
      <h1 class="sidebar__logo">📝 做题本</h1>
      <button id="btnToggleSidebar" class="jy-btn jy-btn--icon sidebar__toggle">☰</button>
    </div>
    <div class="sidebar__section">
      <span class="sidebar__section-title">📊 统计</span>
      <div id="statsPanel" class="stats-panel"></div>
      <button id="btnComposite" class="jy-btn jy-btn--outline jy-btn--sm" style="width:100%;margin-top:var(--jy-space-2)">📊 复合统计</button>
      <div id="compositeBar" style="display:none;margin-top:var(--jy-space-2);text-align:center">
        <button id="btnCompositeRun" class="jy-btn jy-btn--primary jy-btn--sm">统计选中</button>
        <button id="btnCompositeCancel" class="jy-btn jy-btn--ghost jy-btn--sm">取消</button>
      </div>
      <div id="groupChips" style="display:none;margin-top:var(--jy-space-2);flex-wrap:wrap;gap:4px"></div>
    </div>
    <div class="sidebar__footer">
      <button id="btnToggleTheme" class="jy-btn jy-btn--outline jy-btn--sm sidebar__action-btn">🌙 暗色模式</button>
      <a href="../../index.html" class="jy-btn jy-btn--ghost jy-btn--sm sidebar__action-btn" style="width:100%;justify-content:center">🏠 首页</a>
    </div>
  </aside>

  <!-- 主区域 -->
  <main class="main">

    <!-- ====== 列表视图 ====== -->
    <div id="listView">
      <header class="main__toolbar">
        <button id="btnOpenSidebar" class="jy-btn jy-btn--icon jy-show-mobile">☰</button>
        <div class="main__toolbar-title">我的做题本</div>
        <div class="search-box">
          <span class="search-box__icon">🔍</span>
          <input id="searchBooks" type="text" class="search-box__input" placeholder="搜索做题本...">
          <button id="btnClearSearchBooks" class="search-box__clear" style="display:none">✕</button>
        </div>
        <button id="btnSearchStats" class="jy-btn jy-btn--outline jy-btn--sm" style="display:none;white-space:nowrap">📊 统计「<span id="searchStatsLabel"></span>」</button>
        <div class="main__toolbar-actions">
          <button id="btnAdd" class="jy-btn jy-btn--primary">＋ 新建做题本</button>
        </div>
      </header>
      <div id="mainChips" style="display:none;padding:0 var(--jy-space-4);margin-bottom:var(--jy-space-3);flex-wrap:wrap;gap:4px"></div>
      <div class="panel">
        <div id="bookList" class="book-grid"></div>
        <div id="emptyState" class="jy-empty" style="display:none">
          <div class="jy-empty__icon">📝</div>
          <div class="jy-empty__text">还没有做题本</div>
          <div class="jy-empty__sub">点「＋ 新建做题本」创建第一个做题本，开始刷题之旅</div>
        </div>
      </div>
    </div>

    <!-- ====== 答题视图 ====== -->
    <div id="answerView" style="display:none">
      <header class="answer-toolbar">
        <button id="btnBackToList" class="jy-btn jy-btn--ghost jy-btn--sm">← 返回列表</button>
        <span class="answer-toolbar__title" id="answerBookTitle"></span>
        <span class="answer-toolbar__progress" id="answerProgress"></span>
        <span class="answer-toolbar__spacer"></span>
        <span id="answerScoreBadge" class="answer-toolbar__score" style="display:none"></span>
        <button id="btnEditBookFromAnswer" class="jy-btn jy-btn--outline jy-btn--sm">✎ 编辑信息</button>
      </header>
      <div class="answer-content">
        <div class="answer-content__questions" id="questionList"></div>
        <aside class="answer-content__summary" id="summaryPanel">
          <div class="summary__section">
            <div class="summary__title">📋 答案汇总</div>
            <div class="summary__groups" id="summaryContent"></div>
          </div>

          <!-- 核对区 -->
          <div id="checkSection" class="summary__section summary__section--check" style="display:none">
            <div class="summary__title">📊 核对结果</div>
            <div id="checkResults"></div>
          </div>

          <!-- 未全部答完时的提示 -->
          <div id="checkHint" class="summary__hint">
            <span id="checkHintText">完成所有题目后可录入正确答案</span>
          </div>

          <!-- 按钮区 -->
          <div class="summary__actions">
            <button id="btnOpenCheck" class="jy-btn jy-btn--primary jy-btn--sm" style="width:100%;display:none">🔍 录入正确答案</button>
            <button id="btnRecheck" class="jy-btn jy-btn--outline jy-btn--sm" style="width:100%;display:none">🔄 重新核对</button>
            <button id="btnCopyAnswers" class="jy-btn jy-btn--outline jy-btn--sm" style="width:100%;margin-top:var(--jy-space-2)">📋 复制我的答案</button>
          </div>
          <span id="copyFeedback" class="copy-feedback">已复制到剪贴板</span>
        </aside>
      </div>
    </div>

  </main>
</div>

<!-- ====== 新建/编辑做题本弹窗 ====== -->
<div id="editBookOverlay" class="jy-overlay">
  <div class="jy-modal" style="max-width:480px">
    <div class="jy-modal__header">
      <span class="jy-modal__title" id="editBookModalTitle">新建做题本</span>
      <button class="jy-btn jy-btn--icon modal-close-btn">✕</button>
    </div>
    <div class="jy-modal__body">
      <form id="editBookForm">
        <div class="jy-form-group">
          <label class="jy-label">名称 <span style="color:var(--jy-danger)">*</span></label>
          <input type="text" id="editBookName" class="jy-input" placeholder="例如：第一章练习题" required maxlength="100">
        </div>
        <div class="jy-form-group">
          <label class="jy-label">类型</label>
          <select id="editBookType" class="jy-select">
            <option value="choice">🔤 选择题</option>
            <option value="open">📝 非选择题（自评对/错）</option>
          </select>
        </div>
        <div class="jy-form-group">
          <label class="jy-label">题目数量 <span style="color:var(--jy-danger)">*</span></label>
          <input type="number" id="editBookQCount" class="jy-input" placeholder="正整数" min="1" max="500" required>
          <span class="jy-form-hint" id="qcountHint" style="display:none;font-size:var(--jy-font-size-xs);color:var(--jy-text-muted);margin-top:var(--jy-space-1)">创建后不可修改</span>
        </div>
        <div class="jy-form-group">
          <label class="jy-label">题号区间 <span style="color:var(--jy-text-muted);font-weight:400">（选填，不填默认 1 到题目数量）</span></label>
          <div style="display:flex;gap:var(--jy-space-2);align-items:center">
            <input type="number" id="editBookStartNo" class="jy-input" placeholder="开始题号，如 17" min="0" style="flex:1">
            <span style="color:var(--jy-text-muted)">—</span>
            <input type="number" id="editBookEndNo" class="jy-input" placeholder="结束题号，如 24" min="1" style="flex:1">
          </div>
          <span class="jy-form-hint" style="display:block;font-size:var(--jy-font-size-xs);color:var(--jy-text-muted);margin-top:var(--jy-space-1)">填了区间会自动计算题目数量（如 17—24 共 8 题），作答与汇总按实际题号显示</span>
        </div>
        <div class="jy-form-group">
          <label class="jy-label">备注</label>
          <input type="text" id="editBookNotes" class="jy-input" placeholder="选填">
        </div>
        <input type="hidden" id="editBookId">
      </form>
    </div>
    <div class="jy-modal__footer">
      <button class="jy-btn jy-btn--ghost modal-close-btn">取消</button>
      <button id="btnSaveBook" class="jy-btn jy-btn--primary">💾 保存</button>
    </div>
  </div>
</div>

<!-- ====== 删除确认弹窗 ====== -->
<div id="confirmDeleteOverlay" class="jy-overlay">
  <div class="jy-modal" style="max-width:400px">
    <div class="jy-modal__header"><span class="jy-modal__title">确认删除</span><button class="jy-btn jy-btn--icon modal-close-btn">✕</button></div>
    <div class="jy-modal__body">
      <p style="text-align:center;padding:var(--jy-space-4)" id="confirmDeleteMsg">确定删除此做题本？题目答案也会一并删除。</p>
    </div>
    <div class="jy-modal__footer">
      <button class="jy-btn jy-btn--ghost modal-close-btn">取消</button>
      <button id="btnConfirmDelete" class="jy-btn jy-btn--danger">确认删除</button>
    </div>
  </div>
</div>

<!-- ====== 录入正确答案弹窗 ====== -->
<div id="checkAnswersOverlay" class="jy-overlay">
  <div class="jy-modal" style="max-width:680px">
    <div class="jy-modal__header">
      <span class="jy-modal__title">🔍 录入正确答案</span>
      <button class="jy-btn jy-btn--icon modal-close-btn">✕</button>
    </div>
    <div class="jy-modal__body">
      <p class="check-hint">请逐题选择 <strong>正确答案</strong>，用于核对你已提交的答案。未选中的题目不会参与比对。</p>
      <div id="correctAnswersList" class="correct-answers-grid"></div>
    </div>
    <div class="jy-modal__footer">
      <button class="jy-btn jy-btn--ghost modal-close-btn">取消</button>
      <button id="btnRunCheck" class="jy-btn jy-btn--primary">🔍 开始核对</button>
    </div>
  </div>
</div>

<!-- ====== 复合统计弹窗 ====== -->
<div id="compositeOverlay" class="jy-overlay modal-close-target">
  <div class="jy-modal" style="max-width:580px">
    <div class="jy-modal__header">
      <span class="jy-modal__title">📊 复合统计结果</span>
      <button class="jy-btn jy-btn--icon modal-close-btn">✕</button>
    </div>
    <div class="jy-modal__body" id="compositeBody"></div>
    <div class="jy-modal__footer">
      <button class="jy-btn jy-btn--ghost modal-close-btn">关闭</button>
    </div>
  </div>
</div>

<script src="../../shared/db-core.js"></script>
<script src="app.js"></script>
</body>
</html>
