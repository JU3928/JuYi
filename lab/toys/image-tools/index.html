<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万能图片 — JuYi 实验室</title>
  <link rel="stylesheet" href="../../../shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="it-app">

  <!-- ====== 顶栏 ====== -->
  <header class="it-topbar">
    <div class="it-topbar__brand">
      <span class="it-topbar__icon">🖼️</span>
      <div>
        <h1 class="it-topbar__title">万能图片</h1>
        <span class="it-topbar__sub">粘贴图片 · 一键下载</span>
      </div>
    </div>
    <div class="it-topbar__right">
      <button id="btnToggleTheme" class="jy-btn jy-btn--ghost jy-btn--icon jy-btn--sm">🌙</button>
      <a href="../../index.html" class="jy-btn jy-btn--ghost jy-btn--sm">🧪 实验室</a>
      <a href="../../../index.html" class="jy-btn jy-btn--ghost jy-btn--sm">🏠 首页</a>
    </div>
  </header>

  <!-- ====== 主体 ====== -->
  <main class="it-body">

    <!-- 粘贴区域 -->
    <div class="it-paste-zone" id="pasteZone">
      <div class="it-paste-zone__inner">
        <div class="it-paste-zone__icon">📋</div>
        <div class="it-paste-zone__title">在此处粘贴图片</div>
        <div class="it-paste-zone__hint">按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 粘贴剪贴板中的图片</div>
        <div class="it-paste-zone__formats">支持 PNG · JPG · GIF · WebP · BMP · SVG</div>
      </div>
    </div>

    <!-- 预览区域 -->
    <div class="it-preview" id="previewPanel" style="display:none">
      <div class="it-preview__header">
        <h3>📷 图片预览</h3>
        <div class="it-preview__info">
          <span id="imgInfo"></span>
        </div>
      </div>
      <div class="it-preview__canvas-wrap">
        <img id="previewImg" alt="粘贴的图片">
      </div>
      <div class="it-preview__actions">
        <button id="btnDownload" class="jy-btn jy-btn--primary jy-btn--lg">
          💾 下载图片
        </button>
        <button id="btnCopyAgain" class="jy-btn jy-btn--outline jy-btn--lg">
          📋 重新复制
        </button>
        <button id="btnClear" class="jy-btn jy-btn--ghost jy-btn--lg">
          🗑️ 清除
        </button>
      </div>
    </div>

    <!-- 历史记录 -->
    <div class="it-history" id="historyPanel" style="display:none">
      <div class="it-history__header">
        <h3>📚 粘贴历史</h3>
        <span class="it-history__count" id="historyCount">0</span>
        <button id="btnClearHistory" class="jy-btn jy-btn--ghost jy-btn--sm" style="margin-left:auto">清空历史</button>
      </div>
      <div class="it-history__grid" id="historyGrid"></div>
    </div>

  </main>

</div>

<script src="app.js"></script>
</body>
</html>
