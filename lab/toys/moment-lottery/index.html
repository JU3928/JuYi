<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友圈点赞抽奖器 — JuYi 实验室</title>
  <link rel="stylesheet" href="../../../shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ml-app">

  <!-- ====== 顶栏 ====== -->
  <header class="ml-topbar">
    <div class="ml-topbar__brand">
      <span class="ml-topbar__icon">🎰</span>
      <div>
        <h1 class="ml-topbar__title">朋友圈点赞抽奖器</h1>
        <span class="ml-topbar__sub">截图自动提取头像 · 随机公平抽奖</span>
      </div>
    </div>

    <div class="ml-topbar__center">
      <label class="ml-upload-btn jy-btn jy-btn--primary jy-btn--sm">
        📤 上传截图
        <input type="file" id="fileInput" accept="image/*" hidden>
      </label>
      <button id="btnLoadDemo" class="jy-btn jy-btn--outline jy-btn--sm">📷 示例</button>
      <span class="ml-topbar__divider"></span>
      <button id="btnAutoDetect" class="jy-btn jy-btn--primary jy-btn--sm">🔍 自动识别</button>
      <label class="ml-mode-toggle" title="默认纯原生算法；开启后按需加载 OpenCV.js CDN 提升准确率">
        <input type="checkbox" id="toggleOpenCV">
        <span class="ml-mode-toggle__track">
          <span class="ml-mode-toggle__thumb"></span>
        </span>
        <span class="ml-mode-toggle__label">OpenCV</span>
      </label>
    </div>

    <div class="ml-topbar__right">
      <button id="btnToggleTheme" class="jy-btn jy-btn--ghost jy-btn--icon jy-btn--sm">🌙</button>
      <a href="../../index.html" class="jy-btn jy-btn--ghost jy-btn--sm">🧪 实验室</a>
      <a href="../../../index.html" class="jy-btn jy-btn--ghost jy-btn--sm">🏠 首页</a>
    </div>
  </header>

  <!-- ====== 主体双栏 ====== -->
  <div class="ml-body">

    <!-- 左侧：画布 -->
    <section class="ml-canvas-panel">
      <div class="ml-canvas-toolbar">
        <button id="btnZoomOut" class="jy-btn jy-btn--ghost jy-btn--icon jy-btn--sm" title="缩小">🔍−</button>
        <span class="ml-zoom-label" style="font-size:11px;color:var(--jy-text-muted);min-width:40px;text-align:center">100%</span>
        <button id="btnZoomIn" class="jy-btn jy-btn--ghost jy-btn--icon jy-btn--sm" title="放大">🔍+</button>
        <button id="btnZoomFit" class="jy-btn jy-btn--ghost jy-btn--sm">适应</button>
        <span class="ml-toolbar-divider"></span>
        <button id="btnClearAll" class="jy-btn jy-btn--outline jy-btn--sm">✕ 清空选区</button>
        <span class="ml-toolbar-hint">💡 按住 Shift 可平移画布 · 拖拽可手动框选</span>
      </div>

      <div class="ml-canvas-card">
        <div class="ml-canvas-wrap" id="canvasWrap">
          <canvas id="mainCanvas"></canvas>
          <div class="ml-canvas-placeholder" id="canvasPlaceholder">
            <div class="ml-placeholder-icon">📷</div>
            <div class="ml-placeholder-text">上传朋友圈点赞截图<br>或点击「📷 示例」快速体验</div>
            <div class="ml-placeholder-steps">
              <span>① 上传截图</span>
              <span>→</span>
              <span>② 自动识别</span>
              <span>→</span>
              <span>③ 开始抽奖</span>
            </div>
          </div>
        </div>
        <div class="ml-detect-status" id="detectStatus" style="display:none">
          <span class="ml-detect-status__dot"></span>
          <span id="detectStatusText"></span>
        </div>
      </div>
    </section>

    <!-- 右侧：侧边栏 -->
    <aside class="ml-sidebar">

      <!-- 头像池 -->
      <div class="ml-panel">
        <div class="ml-panel__header">
          <h3>🖼️ 头像池</h3>
          <span class="ml-badge" id="avatarCount">0</span>
          <button id="btnClearPool" class="ml-link-btn">清空</button>
        </div>
        <div class="ml-panel__body">
          <div class="ml-avatar-grid" id="avatarGrid">
            <div class="ml-empty">暂无头像<br><small>点击「自动识别」或拖拽框选</small></div>
          </div>
        </div>
      </div>

      <!-- 抽奖配置 -->
      <div class="ml-panel">
        <div class="ml-panel__header">
          <h3>🎯 抽奖配置</h3>
        </div>
        <div class="ml-panel__body">
          <div class="ml-config">
            <div class="ml-config__row">
              <label>抽取人数</label>
              <input type="number" id="drawCount" value="1" min="1" max="50" class="ml-input-num">
            </div>
            <div class="ml-config__row">
              <label>动画类型</label>
              <select id="animType" class="ml-select-sm">
                <option value="jump">🎪 跳动高亮</option>
                <option value="marquee">🏃 跑马灯</option>
                <option value="wheel">🎡 环形转盘</option>
              </select>
            </div>
            <div class="ml-config__row">
              <label>时长 (秒)</label>
              <input type="number" id="animDuration" value="3" min="1" max="10" class="ml-input-num">
            </div>
            <div class="ml-config__checks">
              <label class="ml-check"><input type="checkbox" id="allowRepeat" checked> 允许重复中奖</label>
              <label class="ml-check"><input type="checkbox" id="showParticles" checked> ✨ 粒子特效</label>
            </div>
          </div>
          <button id="btnStartLottery" class="jy-btn jy-btn--primary" style="width:100%;padding:12px;font-size:1.15rem;font-weight:700;margin-top:12px">
            🎰 开始抽奖
          </button>
        </div>
      </div>

      <!-- 数据管理 -->
      <div class="ml-panel">
        <div class="ml-panel__header">
          <h3>💾 数据</h3>
        </div>
        <div class="ml-panel__body">
          <div class="ml-data-btns">
            <button id="btnExport" class="jy-btn jy-btn--outline jy-btn--sm">📤 导出备份</button>
            <button id="btnImport" class="jy-btn jy-btn--outline jy-btn--sm">📥 导入恢复</button>
            <input type="file" id="importFile" accept=".json" hidden>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- ====== 底部：抽奖历史 ====== -->
  <div class="ml-history" id="historyPanel">
    <div class="ml-history__bar" id="historyToggle">
      <h3>📋 抽奖历史 <span class="ml-badge ml-badge--sm" id="historyCount">0</span></h3>
      <span class="ml-history__arrow">▾</span>
    </div>
    <div class="ml-history__content" id="historyBody">
      <div class="ml-empty">暂无抽奖记录</div>
    </div>
  </div>

</div>

<!-- ====== 抽奖动画层 ====== -->
<div class="ml-overlay" id="lotteryOverlay" style="display:none">
  <div class="ml-stage" id="lotteryStage"></div>
  <div class="ml-stage-actions">
    <button id="btnReveal" class="jy-btn jy-btn--primary jy-btn--lg" style="font-size:1.15rem;font-weight:700;padding:12px 32px">
      🎉 揭晓结果
    </button>
    <button id="btnCancelLottery" class="jy-btn jy-btn--ghost jy-btn--lg" style="color:#fff">取消</button>
  </div>
</div>

<!-- ====== 结果弹窗 ====== -->
<div class="jy-overlay modal-close-target" id="resultOverlay">
  <div class="jy-modal" style="max-width:560px">
    <div class="jy-modal__header">
      <span class="jy-modal__title">🎉 抽奖结果</span>
      <button class="jy-btn jy-btn--icon modal-close-btn">✕</button>
    </div>
    <div class="jy-modal__body">
      <div class="ml-result-grid" id="resultGrid"></div>
    </div>
    <div class="jy-modal__footer">
      <button class="jy-btn jy-btn--ghost modal-close-btn">关闭</button>
      <button id="btnReroll" class="jy-btn jy-btn--primary">🎰 再来一局</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
