<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇引擎单测</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 760px; margin: 0 auto; }
    h1 { font-size: 18px; }
    #summary { font-size: 16px; font-weight: 700; padding: 12px; border-radius: 8px; }
    #details { white-space: pre-wrap; color: #c0392b; font-size: 13px; }
  </style>
</head>
<body>
  <h1>贪吃蛇引擎单测（snake-engine.js）</h1>
  <div id="summary">运行中…</div>
  <div id="details"></div>

  <script src="snake-engine.js"></script>
  <script>
  ;(function () {
    'use strict';
    var E = window.SnakeEngine;
    var passed = 0, failed = 0, fails = [];

    function t(name, fn) {
      try { fn(); passed++; }
      catch (e) { failed++; fails.push(name + ' — ' + e.message); }
    }
    function eq(a, b, msg) {
      if (a !== b) throw new Error((msg || '') + ' 期望 ' + b + ' 实际 ' + a);
    }
    function ok(v, msg) { if (!v) throw new Error(msg || '断言失败'); }

    function onSnake(s, x, y) {
      return s.some(function (seg) { return seg.x === x && seg.y === y; });
    }
    function foodAhead(s, x, y) { s.food = { x: x, y: y }; }

    /* ---------- 初始化 ---------- */
    t('createState：3 节居中向右，分数 0，存活', function () {
      var s = E.createState();
      eq(s.snake.length, 3);
      eq(s.dir, 'right');
      eq(s.score, 0);
      eq(s.alive, true);
      eq(s.snake[0].x, 10); eq(s.snake[0].y, 10); // 20 网格中心
      eq(s.snake[1].x, 9); eq(s.snake[2].x, 8);
    });

    t('createState：食物在界内且不在蛇身上', function () {
      for (var i = 0; i < 50; i++) {
        var s = E.createState();
        ok(E.inBounds(s.food, s.grid), '食物越界 (' + s.food.x + ',' + s.food.y + ')');
        ok(!onSnake(s.snake, s.food.x, s.food.y), '食物落在蛇身上');
      }
    });

    t('自定义小网格也合法', function () {
      var s = E.createState(5);
      eq(s.grid, 5);
      eq(s.snake[0].x, 2);
      ok(E.inBounds(s.food, 5), '食物越界');
    });

    /* ---------- 移动 ---------- */
    t('step：向右前进一格', function () {
      var s = E.createState();
      var hx = s.snake[0].x;
      E.step(s);
      eq(s.snake[0].x, hx + 1, '头应右移');
      eq(s.snake[0].y, s.snake[1].y);
      eq(s.snake.length, 3, '未吃食长度不变');
      eq(s.steps, 1);
    });

    t('step：蛇尾跟随（不残留）', function () {
      var s = E.createState();
      var tail = s.snake[s.snake.length - 1];
      E.step(s);
      var newTail = s.snake[s.snake.length - 1];
      eq(newTail.x, tail.x + 1, '新尾应是旧尾前一节位置');
    });

    /* ---------- 转向 ---------- */
    t('turn + step：转向生效', function () {
      var s = E.createState();
      E.turn(s, 'up');
      E.step(s);
      eq(s.dir, 'up');
      eq(s.snake[0].y, 9, '头应上移');
    });

    t('180° 掉头被忽略', function () {
      var s = E.createState(); // 向右
      E.turn(s, 'left');
      E.step(s);
      eq(s.dir, 'right', '掉头应被忽略');
      eq(s.snake[0].x, 11, '仍应右移');
    });

    t('快速连按：以最后一格的有效转向为准', function () {
      var s = E.createState(); // 向右
      E.turn(s, 'up');
      E.turn(s, 'down'); // 与 up 相反？不，down 与当前 right 不相反 → 应采纳 down
      E.step(s);
      eq(s.dir, 'down', '应采纳最后一次转向');
      eq(s.snake[0].y, 11);
    });

    t('无效方向被忽略', function () {
      var s = E.createState();
      E.turn(s, 'diagonal');
      E.step(s);
      eq(s.dir, 'right', '无效方向不应改变朝向');
    });

    /* ---------- 吃食 ---------- */
    t('吃食物：+1 分、变长、食物刷新', function () {
      var s = E.createState();
      var head = s.snake[0];
      foodAhead(s, head.x + 1, head.y); // 食物放正前方
      E.step(s);
      eq(s.score, 1);
      eq(s.snake.length, 4);
      eq(s.snake[0].x, head.x + 1, '新头应是食物位置');
      ok(!onSnake(s.snake, s.food.x, s.food.y), '新食物不应在蛇身上');
      ok(E.inBounds(s.food, s.grid), '新食物越界');
    });

    t('连续吃食长度与分数同步增长', function () {
      var s = E.createState();
      for (var i = 0; i < 5; i++) {
        var h = s.snake[0];
        foodAhead(s, h.x + 1, h.y);
        E.step(s);
      }
      eq(s.score, 5);
      eq(s.snake.length, 8);
      eq(s.alive, true);
    });

    t('注入 rng：食物落在首个空位（确定性）', function () {
      var s = E.createState(5);
      var food = E.spawnFood(s, function () { return 0; });
      // rng=0 → idx=0 → (0,0)，蛇在 y=2 行不占它
      eq(food.x, 0); eq(food.y, 0);
    });

    t('rng 恶劣（永远指已占格）也能兜底生成', function () {
      var s = E.createState(5);
      var food = E.spawnFood(s, function () { return 0.99999; }); // idx≈24，可能已占
      ok(food !== null, '不应返回 null');
      ok(!onSnake(s.snake, food.x, food.y), '兜底食物不应在蛇身上');
    });

    /* ---------- 死亡 ---------- */
    t('撞墙死亡', function () {
      var s = E.createState();
      s.snake = [{ x: 19, y: 10 }, { x: 18, y: 10 }, { x: 17, y: 10 }];
      s.dir = 'right';
      E.step(s);
      eq(s.alive, false, '应撞墙死亡');
    });

    t('撞自己死亡', function () {
      var s = E.createState();
      // 蛇形：头 (2,2) 向左 → 新头 (1,2) 是身体（非尾）
      s.snake = [{ x: 2, y: 2 }, { x: 2, y: 3 }, { x: 1, y: 3 }, { x: 1, y: 2 }, { x: 1, y: 1 }];
      s.dir = 'left';
      E.step(s);
      eq(s.alive, false, '应撞自己死亡');
    });

    t('经典规则：头进入尾节即将让出的格子不判死', function () {
      var s = E.createState();
      // 环形：头 (2,2) 向左 → (1,2) 正是尾节，尾将让出 → 应存活
      s.snake = [{ x: 2, y: 2 }, { x: 2, y: 3 }, { x: 1, y: 3 }, { x: 1, y: 2 }];
      s.dir = 'left';
      E.step(s);
      eq(s.alive, true, '追尾不算撞自己');
      eq(s.snake.length, 4);
    });

    t('死亡后 step/turn 均为空操作', function () {
      var s = E.createState();
      s.alive = false;
      var snapshot = JSON.stringify(s.snake);
      E.turn(s, 'up');
      E.step(s);
      eq(s.alive, false);
      eq(JSON.stringify(s.snake), snapshot, '死蛇不应再动');
      eq(s.steps, 0);
    });

    /* ---------- 工具函数 ---------- */
    t('isOpposite：对向判定', function () {
      ok(E.isOpposite('up', 'down'));
      ok(E.isOpposite('left', 'right'));
      ok(!E.isOpposite('up', 'left'));
      ok(!E.isOpposite('right', 'up'));
    });

    t('inBounds / move 基础行为', function () {
      ok(E.inBounds({ x: 0, y: 0 }, 20));
      ok(E.inBounds({ x: 19, y: 19 }, 20));
      ok(!E.inBounds({ x: 20, y: 0 }, 20));
      ok(!E.inBounds({ x: -1, y: 0 }, 20));
      var m = E.move({ x: 3, y: 4 }, 'down');
      eq(m.x, 3); eq(m.y, 5);
    });

    /* ---------- 通关（边界） ---------- */
    t('占满全屏 → 通关标记', function () {
      var s = E.createState(2);
      // 手工构造：蛇占 3 格（2×2 网格里），食物放最后一格
      s.snake = [{ x: 0, y: 0 }, { x: 1, y: 0 }, { x: 1, y: 1 }];
      s.dir = 'down';
      s.food = { x: 0, y: 1 };
      E.step(s);
      eq(s.score, 1);
      eq(s.alive, false);
      eq(s.won, true, '吃满全屏应判通关');
    });

    /* ---------- 汇总 ---------- */
    var s = document.getElementById('summary');
    if (failed === 0) {
      s.textContent = '全部通过：' + passed + ' 项';
      s.style.background = '#e8f8ec';
      s.style.color = '#1a7f37';
    } else {
      s.textContent = '失败 ' + failed + ' / ' + (passed + failed) + ' 项';
      s.style.background = '#fdecea';
      s.style.color = '#c0392b';
      document.getElementById('details').textContent = fails.join('\n');
    }
  })();
  </script>
</body>
</html>
